<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tryout TKA SD</title>
<meta name="description" content="Simulasi ujian berbasis komputer (CBT) untuk latihan Tes Kemampuan Akademik SD: Matematika dan Bahasa Indonesia.">
<meta name="theme-color" content="#6a3fe6">
<meta property="og:title" content="Tryout TKA SD">
<meta property="og:description" content="Yuk, berlatih TKA dengan gembira! 20 paket latihan, 600 butir soal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236a3fe6'%2F%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='700' font-size='20' fill='white' text-anchor='middle'%3ETKA%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  html,body{margin:0;height:100%;background:#efeaff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#f3efff,#e2d8ff);color:#2a2368;transition:opacity .4s}
  #muat.hilang{opacity:0;pointer-events:none}
  .logo{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#8d62ff,#5a2fd8);color:#fff;font-weight:800;font-size:20px;box-shadow:0 12px 26px rgba(90,47,216,.35)}
  .putar{width:34px;height:34px;border-radius:50%;border:4px solid #d6ccff;border-top-color:#6a3fe6;animation:p 1s linear infinite}
  @keyframes p{to{transform:rotate(360deg)}}
  #cadangan{display:none;font-size:14px;text-align:center;padding:0 20px;line-height:1.5}
  #cadangan a{color:#5a2fd8;font-weight:700}
  @media (prefers-reduced-motion:reduce){.putar{animation:none}}
</style>
</head>
<body>
  <div id="muat" role="status" aria-live="polite">
    <div class="logo">TKA</div>
    <div class="putar" aria-hidden="true"></div>
    <div>Memuat Tryout TKA SD…</div>
    <p id="cadangan">Aplikasi belum tampil? <a id="linkLangsung" href="#" target="_top">Buka aplikasi langsung</a></p>
  </div>
  <iframe id="app" title="Tryout TKA SD" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    /* Ganti alamat di bawah ini bila web app Apps Script di-deploy ulang dengan URL baru */
    var GAS_URL = "https://script.google.com/macros/s/AKfycbyiKqdGs9cnNR3DIUeCeYBkFJMnlSsxhwbw8NOOYWMOSgzynAQnxHm-PUUXXzxf0WOl/exec";
    var f = document.getElementById("app"), m = document.getElementById("muat");
    document.getElementById("linkLangsung").href = GAS_URL;
    f.addEventListener("load", function(){ m.classList.add("hilang"); });
    f.src = GAS_URL;
    setTimeout(function(){ document.getElementById("cadangan").style.display = "block"; }, 12000);
  </script>
</body>
</html>
